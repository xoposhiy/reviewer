<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{page}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.css">
<style>
  :root { --bg: #fff; --fg: #1f2328; --link: #0969da; --line: #d0d7de; --muted: #59636e; --mark: #9a6700; --error: #cf222e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #f0f6fc; --link: #4493f8; --line: #3d444d; --muted: #9198a1; --mark: #d29922; --error: #f85149; } }
  body { margin: 0; background: var(--bg); }
  .markdown-body { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: 32px 48px 50vh 84px; }
  .file { font: 12px ui-monospace, monospace; color: var(--muted); margin-bottom: 16px; overflow-wrap: anywhere; }
  .file a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .file a:hover { color: var(--link); }
  .file b { color: var(--fg); font-weight: 600; }
  .error { font: 12px ui-monospace, monospace; color: var(--error); margin-bottom: 16px; }
  .front-matter { font-size: 12px; color: var(--muted); }

  /* the edit buttons of a block, in the left margin: ✎ the block; further left, § the whole section of a heading
     and ≡ the whole list. A list item has the list indent too, so its ✎ is next to the ≡ of its list. */
  .block { position: relative; }
  .block > .edit { position: absolute; left: -36px; top: 0; width: 26px; height: 26px; padding: 0; opacity: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); font: 14px/24px system-ui, sans-serif; }
  li.block > .edit { left: calc(-2em - 36px); }
  .block > .edit::before { content: '✎'; }
  .block > .edit.wide { left: -66px; }
  .block > .edit.section::before { content: '§'; }
  .block > .edit.list::before { content: '≡'; }
  li.editor { list-style: none; }
  .block:hover > .edit, .block > .edit:focus-visible { opacity: 1; }
  .block > .edit:hover { color: var(--mark); border-color: var(--mark); }

  .editor { margin: 0 0 16px; padding: 8px; border: 1px solid var(--mark); border-radius: 8px; }
  .editor textarea, .editor input { box-sizing: border-box; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: inherit; }
  .editor textarea { min-height: 60px; resize: vertical; font: 13px/1.5 ui-monospace, monospace; }
  .editor input { margin-top: 6px; font: 13px system-ui, sans-serif; }
  .editor .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .editor .row span { margin-right: auto; font-size: 12px; color: var(--muted); }
  .editor .row span.error { color: var(--error); }
  .editor button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: none; color: inherit; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .editor button[data-model] { border: 0; background: #ffd166; color: #1c1606; }
  .editor button[data-model] + button[data-model] { background: #9fb6ff; color: #0b1430; }
</style>
</head>
<body>
<main class="markdown-body"><nav class="file"></nav><div class="error" hidden></div><div class="doc"></div></main>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="/__review/markdown.js" data-page="{page}" data-models="{models}" data-project="{project}"></script>
</body>
</html>
